<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8a2be2;
            --secondary: #4b0082;
            --background: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --surface-border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--background);
            background-image: 
                radial-gradient(at 0% 0%, rgba(138, 43, 226, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(75, 0, 130, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-weight: 700;
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(to right, #c084fc, #e879f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glass-panel {
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            animation: fadeIn 1s ease-out;
        }

        .refresh-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(138, 43, 226, 0.6);
        }

        .refresh-btn:active {
            transform: translateY(0);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
            margin-top: -8px;
        }

        th {
            text-align: left;
            padding: 1rem;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        td {
            padding: 1rem;
            background: rgba(255, 255, 255, 0.03);
            transition: background 0.3s;
        }

        tr td:first-child {
            border-top-left-radius: 8px;
            border-bottom-left-radius: 8px;
        }
        
        tr td:last-child {
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        tbody tr {
            transition: transform 0.2s;
        }

        tbody tr:hover td {
            background: rgba(255, 255, 255, 0.08);
            cursor: default;
        }
        
        tbody tr:hover {
            transform: scale(1.01);
        }

        .loading, .error, .empty {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        .badge {
            background: rgba(138, 43, 226, 0.2);
            color: #d8b4fe;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.8rem;
            border: 1px solid rgba(138, 43, 226, 0.4);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Patient Directory</h1>
            <button class="refresh-btn" onclick="fetchPatients()">Refresh Data</button>
        </header>

        <div class="glass-panel">
            <div id="content-area">
                <div class="loading">Loading patients...</div>
            </div>
        </div>
    </div>

    <script>
        async function fetchPatients() {
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = '<div class="loading">Loading patients...</div>';
            
            try {
                // Fetch from the API backend running on the same server
                const response = await fetch('/patients');
                if (!response.ok) throw new Error('Failed to fetch data');
                
                const json = await response.json();
                const patients = json.data;

                if (!patients || patients.length === 0) {
                    contentArea.innerHTML = '<div class="empty">No patients registered yet.</div>';
                    return;
                }

                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>DOB</th>
                                <th>Sex</th>
                                <th>Phone</th>
                                <th>City, State</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                patients.forEach(p => {
                    html += `
                        <tr>
                            <td><strong>${p.first_name} ${p.last_name}</strong></td>
                            <td>${p.date_of_birth}</td>
                            <td>${p.sex}</td>
                            <td>${p.phone_number}</td>
                            <td>${p.city}, ${p.state}</td>
                            <td><span class="badge">Active</span></td>
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
                contentArea.innerHTML = html;
            } catch (error) {
                console.error(error);
                contentArea.innerHTML = `<div class="error">Error loading patients: ${error.message}</div>`;
            }
        }

        // Fetch immediately on load
        fetchPatients();
    </script>
</body>
</html>
